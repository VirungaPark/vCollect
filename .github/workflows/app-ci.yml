name: App CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-ci.yml'
      - '.github/actions/setup-flutter/**'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-ci.yml'
      - '.github/actions/setup-flutter/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs; every main commit keeps its result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: app

jobs:
  analyze:
    name: Format and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - run: flutter test

  build-apk:
    name: Debug APK
    needs: [analyze, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          java: 'true'
      # arm64 matches field phones and keeps artifacts within storage quota
      - run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: vcollect-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
