name: vcollect
description: "Offline field data collection app for Virunga."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7
  # Exact version CI installs; pub treats it as a minimum locally
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_map_mbtiles: ^1.1.0
  geolocator_android: ^5.2.1
  geolocator_apple: ^2.4.3
  geolocator_platform_interface: ^4.4.1
  latlong2: ^0.10.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Synthetic sample data; see the Map screen section of the README.
    - assets/map/
